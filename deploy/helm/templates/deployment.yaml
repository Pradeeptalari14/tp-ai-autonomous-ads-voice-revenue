apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-autonomous-ads-voice-revenue.fullname" . | default "ai-autonomous-ads-voice-revenue" }}
  labels:
    app.kubernetes.io/name: ai-autonomous-ads-voice-revenue
    app.kubernetes.io/part-of: closed-loop-growth-engine
    devsecops.policy/slsa-level: "3"
    devsecops.policy/non-root: "enforced"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-autonomous-ads-voice-revenue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-autonomous-ads-voice-revenue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: revenue-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: MIN_ROAS_FLOOR
              value: {{ .Values.finopsGuardrails.minRoasFloor | quote }}
            - name: MAX_DAILY_BUDGET
              value: {{ .Values.finopsGuardrails.maxDailyBudgetUsd | quote }}
            - name: CIRCUIT_BREAKER_MAX_FAILURES
              value: {{ .Values.finopsGuardrails.circuitBreakerThresholdFailures | quote }}
            - name: META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-revenue-secrets
                  key: meta-app-secret
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-revenue-secrets
                  key: anthropic-api-key
            - name: OMNIDIMENSION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-revenue-secrets
                  key: omnidimension-api-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | nindent 12 }}
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
