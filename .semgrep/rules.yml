rules:
  - id: hardcoded-meta-secret-check
    languages: [python]
    severity: ERROR
    message: "Potential hardcoded Meta Graph API secret or Anthropic token detected. Use environment variables."
    patterns:
      - pattern-regex: '(?i)(meta_app_secret|anthropic_api_key|omnidimension_key)\s*=\s*["\x27][0-9a-zA-Z_\-]{16,}["\x27]'

  - id: raw-phone-number-logging
    languages: [python]
    severity: WARNING
    message: "Logging unredacted phone numbers violates PII compliance. Mask middle digits."
    patterns:
      - pattern-either:
          - pattern: print(..., $EXPR.phone, ...)
          - pattern: print(..., $EXPR.lead_phone, ...)
          - pattern: logger.info(..., $EXPR.phone, ...)
          - pattern: logger.info(..., $EXPR.lead_phone, ...)

  - id: insecure-subprocess-call
    languages: [python]
    severity: ERROR
    message: "Unsafe subprocess execution detected without strict array arguments."
    pattern: subprocess.call($CMD, shell=True, ...)
