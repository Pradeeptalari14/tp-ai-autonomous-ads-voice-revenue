name: 🛡️ DevSecOps & Supply Chain Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  sast-and-secret-audit:
    name: 🔍 Semgrep SAST & AST Secrets Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            .semgrep/rules.yml

  test-and-coverage:
    name: 🧪 Unit & Integration Tests (100% Pass)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Tests
        run: |
          pytest -v tests/ --cov=src --cov-report=term-missing

  sbom-and-container-scan:
    name: 📦 CycloneDX SBOM & Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [sast-and-secret-audit, test-and-coverage]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Container
        run: |
          docker build -t test-runner:latest .

      - name: Generate CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: test-runner:latest
          format: 'cyclonedx-json'
          output-file: 'cyclonedx-sbom.json'

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test-runner:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
